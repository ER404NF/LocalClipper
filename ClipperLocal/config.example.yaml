# Copy this file to config.yaml and fill it in. config.yaml is git-ignored.

# --- Finding streams -------------------------------------------------------
# Free: https://dev.twitch.tv/console/apps -> Register app -> copy Client ID + make a secret.
# OAuth redirect URL can be http://localhost (it's not used).
twitch:
  client_id: ""
  client_secret: ""
  game_name: "Grand Theft Auto VI"

# --- Local AI team -----------------------------------------------------------
# ONE local model runs the whole crew (Agent, Clipper A/B, Planner/Coder/Designer).
# You can also change it in the app: Setup -> Models.
#   qwen3.5:9b  -> default, fits 8-12 GB GPUs
#   bigger model -> smarter tool use + browser control, needs more VRAM
team:
  model: "qwen3.5:9b"
  parallel: 2            # two agents think at the same time (setup sets OLLAMA_NUM_PARALLEL=2)

llm:
  ollama_url: "http://127.0.0.1:11434"

whisper:
  # tiny | base | small | medium | large-v3   (bigger = better captions, slower)
  model: "small"
  device: "auto"        # auto | cuda | cpu
  compute_type: "auto"  # auto | float16 | int8

# --- Clipping ---------------------------------------------------------------
clipping:
  clips_per_source: 5      # how many candidates to make per VOD/live recording
  min_len: 20              # seconds
  max_len: 60              # seconds
  # Monetization mode: aims for 61-90s clips, because TikTok Creator Rewards
  # only pays on videos over 1 minute. Turn off for campaign-only clipping.
  monetization_mode: false
  language: null           # null = auto-detect, or "en"

render:
  layout: "blur"           # blur = gameplay centered on blurred background
                           # facecam = streamer cam on top, gameplay below
  # Facecam position as fractions of the source frame (0-1). Default = top-left quarter.
  facecam: { x: 0.0, y: 0.0, w: 0.25, h: 0.28 }
  captions: true
  watermark: ""            # e.g. "@yourpage" (small text, bottom)

# --- Who you're allowed to clip ---------------------------------------------
# Put streamers whose clipping campaigns you joined (Whop Content Rewards, Vyro,
# their Discord). "credit" gets appended to every caption, as most campaigns require.
streamers:
  - name: "kaicenat"
    platform: "twitch"
    campaign: "Example - replace with the real campaign"
    credit: "Streamer: twitch.tv/kaicenat"
    allowed: ["tiktok", "instagram", "youtube"]

# Only show/process streamers in the list above (recommended).
only_listed_streamers: true

# --- Accounts to post to -----------------------------------------------------
# Easiest: add accounts in the app (Channels page). You can also list API accounts here.
accounts:
  youtube: []
  #  - name: "main"
  #    client_secrets: "secrets/youtube_client.json"
  #    token_file: "secrets/youtube_main_token.json"
  #    privacy: "public"            # public | unlisted | private

  instagram: []
  #  - name: "main"
  #    ig_user_id: "1784..."         # Instagram professional account ID
  #    access_token: "EAAG..."       # long-lived token with instagram_content_publish
  #    graph_url: "https://graph.facebook.com/v21.0"   # or https://graph.instagram.com/v21.0

  tiktok: []
  #  - name: "main"
  #    access_token: "act...."       # user token with video.publish / video.upload scope
  #    mode: "inbox"                 # inbox = lands in TikTok drafts (add a trending sound, post)
  #                                  # direct = posts straight away (app must pass TikTok audit,
  #                                  #          otherwise only SELF_ONLY privacy works)
  #    privacy_level: "SELF_ONLY"


# --- Autopilot (posting while nobody is at the PC) -------------------------------
# Evening: the crew proposes tomorrow's plan, your brother approves it in the app.
# Next day the crew schedules/posts inside the window below (Turkey time).
autopilot:
  enabled: false
  timezone: "Europe/Istanbul"
  window_start: "16:00"
  window_end: "22:00"
  max_per_account_per_day: 2
  gap_minutes: 15
  min_score: 6.0
  require_italy_box: true     # never post if the Italy box is offline

# --- Italy box (old laptop in Turin) ----------------------------------------------
# Run italy-box/setup-italy-box.ps1 on that laptop; it prints the address to paste here
# (or paste it in Settings). Account tabs set to "italy" go through it.
network:
  italy_box_proxy: ""         # e.g. socks5://100.101.102.103:1080
  expect_country: "IT"

# --- Android phone (plugged in by USB, USB debugging on) ---------------------------
phone:
  adb: "adb"
  serial: ""                  # empty = the only phone plugged in
  edits_package: ""           # empty = auto-detect the Edits app

# --- Trend research ---------------------------------------------------------------
research:
  provider: "ddgs"            # ddgs = free DuckDuckGo search | brave = Brave Search API
  brave_key: ""
